name: Native SDK CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.coderabbit.yaml'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [ main, "release/**" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.coderabbit.yaml'
      - 'LICENSE'
      - '.gitignore'

jobs:
  schema-privacy-invariant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce schema privacy invariant
        run: |
          python3 scripts/check-schema-privacy-invariant.py --self-test
          python3 scripts/check-wallet-binding-schema.py

  swift-package:
    # Flutter-free: builds/tests packages/swift/barnard directly. No Flutter
    # toolchain is installed in this job (barnard#56 acceptance criterion:
    # "CI validates each first-class SDK surface independently").
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/swift/barnard
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Resolve simulator destination
        id: destination
        run: |
          UDID=$(xcrun simctl list devices available iOS -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
            runtimes=[k for k in d if 'iOS' in k]; \
            runtimes.sort(reverse=True); \
            devices=[dev for rt in runtimes for dev in d[rt] if 'iPhone' in dev['name']]; \
            print(devices[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: swift build (package graph sanity check)
        run: xcodebuild -scheme Barnard -destination "id=${{ steps.destination.outputs.udid }}" build
      - name: BarnardCore stdlib-only build and purity check
        run: |
          swift build --target BarnardCore
          swift build --target BarnardCoreC
          if grep -RnwE \
            'Foundation|FoundationEssentials|CryptoKit|CoreBluetooth|Security|UIKit|CommonCrypto|SecRandom|UserDefaults|Data|Date|CCCrypt' \
            Sources/BarnardCore Sources/BarnardCoreC; then
            echo "BarnardCore contains a forbidden platform dependency"
            exit 1
          fi
      - name: swift test (Barnard compatibility + BarnardCore unit tests)
        # SWIFT_OPTIMIZATION_LEVEL=-O: the default -Onone debug build makes the
        # BigInteger-based secp256k1 EC math ~9x slower under test, which was
        # the actual cause of this job running with near-zero timeout margin
        # (not test harness or Simulator overhead). -O strips bare `assert()`
        # only (none present in Sources/Tests here; `precondition()` is
        # unaffected), so numeric-correctness test behavior is unchanged.
        run: xcodebuild -scheme Barnard-Package -destination "id=${{ steps.destination.outputs.udid }}" SWIFT_OPTIMIZATION_LEVEL=-O test
      - name: swift test (native macOS, whole package)
        # barnard#192: the package also supports macOS, where the whole graph
        # (including the Barnard target's CoreBluetooth code) builds and tests
        # natively with no simulator. swift test builds what it runs, so no
        # separate swift build is needed. -Xswiftc -O for the same reason the
        # xcodebuild step above passes SWIFT_OPTIMIZATION_LEVEL=-O: the default
        # -Onone build makes the BigInteger-based secp256k1 EC math ~9x slower.
        # Runs in the job's working-directory packages/swift/barnard, i.e. the
        # inner package graph; the root package resolves to the same 23 suites
        # and the repo-root test vectors are reachable from either.
        run: swift test -Xswiftc -O
      - name: Root and inner Swift package manifest drift guard
        working-directory: .
        run: ./scripts/check-swift-package-manifest-mirror.sh
      - name: Scratch consumer builds for iOS Simulator and imports Barnard
        working-directory: .
        run: |
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/Sources/BarnardConsumer"
          cat > "$consumer_dir/Package.swift" <<EOF
          // swift-tools-version: 5.9
          import PackageDescription

          let package = Package(
              name: "BarnardConsumer",
              platforms: [.iOS("14.0")],
              dependencies: [
                  .package(name: "barnard", path: "$GITHUB_WORKSPACE")
              ],
              targets: [
                  .executableTarget(
                      name: "BarnardConsumer",
                      dependencies: [
                          .product(name: "Barnard", package: "barnard")
                      ]
                  )
              ]
          )
          EOF
          cat > "$consumer_dir/Sources/BarnardConsumer/main.swift" <<'EOF'
          import Barnard

          print("Barnard import succeeded")
          EOF
          swift build \
            --package-path "$consumer_dir" \
            --triple arm64-apple-ios15.0-simulator \
            --sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)"

  swift-mirror-sync-check:
    # packages/swift/barnard is the origin for Flutter-free platform adapters
    # and BarnardCore sources mirrored under packages/dart/barnard/ios; this
    # guards against drift (see scripts/check-swift-mirror.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-swift-mirror.sh

  ios-native-example:
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/ios-native
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve simulator destination
        id: destination
        run: |
          UDID=$(xcrun simctl list devices available iOS -j | \
            python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; \
            runtimes=[k for k in d if 'iOS' in k]; \
            runtimes.sort(reverse=True); \
            devices=[dev for rt in runtimes for dev in d[rt] if 'iPhone' in dev['name']]; \
            print(devices[0]['udid'])")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build native iOS example (Flutter-free)
        run: |
          xcodebuild -project BarnardNativeExample.xcodeproj -scheme BarnardNativeExample \
            -destination "id=${{ steps.destination.outputs.udid }}" build

  macos-lab-runner-example:
    # Build only: GitHub's macOS runners have no Bluetooth radio, so the runner
    # is never executed here. The device lab on the real lab host does that.
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: examples/macos-lab-runner
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Check lab runner script syntax
        run: |
          bash -n scripts/bundle.sh
          bash -n scripts/run.sh
      - name: Build headless macOS lab runner
        # SwiftPM only: the lab host has a Swift toolchain but no XcodeGen and
        # no Homebrew, so the runner must build without either.
        run: swift build

  android-library:
    # Flutter-free: builds/tests packages/android/barnard directly. No
    # Flutter or React Native toolchain is installed in this job (barnard#56
    # acceptance criterion: "CI validates each first-class SDK surface
    # independently").
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/android/barnard
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: gradle build (library sanity check)
        run: ./gradlew assembleDebug assembleRelease
      - name: gradle test (crypto/TEK/RPID + signing + engine/identity unit tests)
        run: ./gradlew test
      - name: gradle Maven-local publication and POM validation
        run: |
          ./gradlew publishToMavenLocal -Dmaven.repo.local="$GITHUB_WORKSPACE/.m2/repository"
          version="$(git describe --tags --match 'v[0-9]*' --abbrev=0 | sed 's/^v//')"
          pom="$GITHUB_WORKSPACE/.m2/repository/org/levarac/barnard/$version/barnard-$version.pom"
          test -f "$pom"
          grep -F '<groupId>org.levarac</groupId>' "$pom"
          grep -F '<artifactId>barnard</artifactId>' "$pom"
          grep -F "<version>$version</version>" "$pom"
          grep -F '<name>MIT License</name>' "$pom"
          grep -F '<connection>scm:git:git://github.com/levarac/barnard.git</connection>' "$pom"

  android-mirror-sync-check:
    # packages/android/barnard is the origin for Flutter-free
    # crypto/signing/RPID sources mirrored under packages/dart/barnard/android;
    # this guards against drift (see scripts/check-android-mirror.sh).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-android-mirror.sh

  android-native-example:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/android-native
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Check device-lab host script syntax
        run: bash -n device-lab/run_two_device_loop.sh
      - name: Build native Android example and device-lab test APKs (Flutter-free)
        run: ./gradlew assembleDebug assembleDebugAndroidTest
